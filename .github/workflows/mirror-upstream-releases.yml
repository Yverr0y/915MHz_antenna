name: Mirror upstream releases
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror-releases:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: talkingj/915MHz_antenna
      FORK_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mirror missing upstream releases
        run: |
          gh api --paginate "/repos/${UPSTREAM_REPO}/releases?per_page=100" --jq '.[].tag_name' | while read tag; do
            gh api "/repos/${FORK_REPO}/releases/tags/${tag}" >/dev/null 2>&1 && continue
            gh release create "$tag" --repo "$FORK_REPO" --title "$tag" --target "${{ github.event.repository.default_branch }}"
          done